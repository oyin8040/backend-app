<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arsenal Final</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(to right,#8B0000,#ff0000);
    font-family:Arial;
    color:white;
    text-align:center;
}

.container{
    margin-top:100px;
}

h1{
    font-size:45px;
}

p{
    font-size:22px;
}

button{
    padding:15px 35px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:white;
    color:#d00000;
    margin-top:20px;
}

.ball{
    position:absolute;
    bottom:50px;
    left:-100px;
    font-size:70px;
    animation:roll 8s linear infinite;
}

@keyframes roll{
    0%{
        left:-100px;
        transform:rotate(0deg);
    }

    100%{
        left:110%;
        transform:rotate(720deg);
    }
}

</style>
</head>

<body>

<div class="container">

<h1>⚽ Arsenal is in the Champions League Final 🔥</h1>

<p>The Gunners are back ❤️🤍</p>

<button onclick="celebrate()">
Celebrate 🎉
</button>

</div>

<div class="ball">⚽</div>

<script>

function celebrate(){
    alert("Come On Arsenal ❤️🤍");
}

</script>

</body>
</html>
