<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Combat Arena</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#0d0d0d;
    color:white;
}

h1{
    text-align:center;
    color:#ffcc00;
}

.ball{
    text-align:center;
    font-size:70px;
    animation:spin 4s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

.match{
    background:#1b1b1b;
    padding:20px;
    margin-top:25px;
    border-radius:15px;
    box-shadow:0 0 10px #000;
}

.players{
    text-align:center;
    font-size:24px;
    margin-bottom:20px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.home{
    background:#d00000;
    color:white;
}

.draw{
    background:gray;
    color:white;
}

.away{
    background:#0077ff;
    color:white;
}

.result{
    margin-top:15px;
    text-align:center;
    font-size:18px;
}

</style>
</head>

<body>

<h1>⚽ Ultimate Football Combat Arena 🔥</h1>

<div class="ball">⚽</div>

<!-- Match Template -->

<div class="match">
<div class="players">🔥 Saka VS McGinn 🔥</div>

<div class="buttons">
<button class="home" onclick="vote('a1')">Home</button>
<button class="draw" onclick="vote('a2')">Draw</button>
<button class="away" onclick="vote('a3')">Away</button>
</div>

<div class="result">
Home: <span id="a1">0</span> |
Draw: <span id="a2">0</span> |
Away: <span id="a3">0</span>
</div>
</div>

<div class="match">
<div class="players">⚡ Osimhen VS Haaland ⚡</div>

<div class="buttons">
<button class="home" onclick="vote('b1')">Home</button>
<button class="draw" onclick="vote('b2')">Draw</button>
<button class="away" onclick="vote('b3')">Away</button>
</div>

<div class="result">
Home: <span id="b1">0</span> |
Draw: <span id="b2">0</span> |
Away: <span id="b3">0</span>
</div>
</div>

<div class="match">
<div class="players">👑 Mbappé VS Vinicius Jr 👑</div>

<div class="buttons">
<button class="home" onclick="vote('c1')">Home</button>
<button class="draw" onclick="vote('c2')">Draw</button>
<button class="away" onclick="vote('c3')">Away</button>
</div>

<div class="result">
Home: <span id="c1">0</span> |
Draw: <span id="c2">0</span> |
Away: <span id="c3">0</span>
</div>
</div>

<div class="match">
<div class="players">💥 Salah VS Son 💥</div>

<div class="buttons">
<button class="home" onclick="vote('d1')">Home</button>
<button class="draw" onclick="vote('d2')">Draw</button>
<button class="away" onclick="vote('d3')">Away</button>
</div>

<div class="result">
Home: <span id="d1">0</span> |
Draw: <span id="d2">0</span> |
Away: <span id="d3">0</span>
</div>
</div>

<div class="match">
<div class="players">🚀 Bellingham VS Pedri 🚀</div>

<div class="buttons">
<button class="home" onclick="vote('e1')">Home</button>
<button class="draw" onclick="vote('e2')">Draw</button>
<button class="away" onclick="vote('e3')">Away</button>
</div>

<div class="result">
Home: <span id="e1">0</span> |
Draw: <span id="e2">0</span> |
Away: <span id="e3">0</span>
</div>
</div>

<script>

function vote(id){
    let count = document.getElementById(id);
    count.innerText = Number(count.innerText) + 1;
}

</script>

</body>
</html>
