<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Battle Voting</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#111;
    color:white;
}

h1{
    text-align:center;
    color:#ffcc00;
}

.match{
    background:#1e1e1e;
    padding:20px;
    margin-top:25px;
    border-radius:15px;
}

.players{
    font-size:24px;
    text-align:center;
    margin-bottom:20px;
}

.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.home{
    background:#d00000;
    color:white;
}

.draw{
    background:gray;
    color:white;
}

.away{
    background:#0096ff;
    color:white;
}

.result{
    text-align:center;
    margin-top:15px;
    font-size:18px;
}

.ball{
    text-align:center;
    font-size:60px;
    animation:spin 4s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body>

<h1>⚽ Football Combat Voting Arena 🔥</h1>

<div class="ball">⚽</div>

<!-- Match 1 -->
<div class="match">

<div class="players">
🔥 Saka VS McGinn 🔥
</div>

<div class="buttons">

<button class="home" onclick="homeVote('m1home')">
Home
</button>

<button class="draw" onclick="drawVote('m1draw')">
Draw
</button>

<button class="away" onclick="awayVote('m1away')">
Away
</button>

</div>

<div class="result">
Home: <span id="m1home">0</span> |
Draw: <span id="m1draw">0</span> |
Away: <span id="m1away">0</span>
</div>

</div>

<!-- Match 2 -->
<div class="match">

<div class="players">
⚡ Victor Osimhen VS Haaland ⚡
</div>

<div class="buttons">

<button class="home" onclick="homeVote('m2home')">
Home
</button>

<button class="draw" onclick="drawVote('m2draw')">
Draw
</button>

<button class="away" onclick="awayVote('m2away')">
Away
</button>

</div>

<div class="result">
Home: <span id="m2home">0</span> |
Draw: <span id="m2draw">0</span> |
Away: <span id="m2away">0</span>
</div>

</div>

<script>

function homeVote(id){
    let count = document.getElementById(id);
    count.innerText = Number(count.innerText) + 1;
}

function drawVote(id){
    let count = document.getElementById(id);
    count.innerText = Number(count.innerText) + 1;
}

function awayVote(id){
    let count = document.getElementById(id);
    count.innerText = Number(count.innerText) + 1;
}

</script>

</body>
</html>
