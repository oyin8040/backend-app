<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Voting App</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(to right,#8B0000,#ff0000);
    color:white;
    text-align:center;
}

.container{
    padding-top:80px;
}

h1{
    font-size:40px;
}

.vote-box{
    margin-top:40px;
}

button{
    padding:15px 30px;
    margin:15px;
    border:none;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
}

.arsenal{
    background:white;
    color:red;
}

.psg{
    background:blue;
    color:white;
}

.result{
    margin-top:40px;
    font-size:28px;
}

.ball{
    font-size:60px;
    animation:spin 3s linear infinite;
    display:inline-block;
    margin-top:20px;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body>

<div class="container">

<h1>⚽ Champions League Final Voting App 🔥</h1>

<p>Who will win the final?</p>

<div class="ball">⚽</div>

<div class="vote-box">

<button class="arsenal" onclick="voteArsenal()">
❤️ Arsenal
</button>

<button class="psg" onclick="votePSG()">
💙 PSG
</button>

</div>

<div class="result">

<p>Arsenal Votes: <span id="arsenalVotes">0</span></p>

<p>PSG Votes: <span id="psgVotes">0</span></p>

</div>

</div>

<script>

let arsenal = 0;
let psg = 0;

function voteArsenal(){
    arsenal++;
    document.getElementById("arsenalVotes").innerText = arsenal;
}

function votePSG(){
    psg++;
    document.getElementById("psgVotes").innerText = psg;
}

</script>

</body>
</html>
