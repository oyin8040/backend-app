<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArenaBet</title><link rel="stylesheet" href="style.css"><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#121212;
    color:#ffffff;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:#1e1e1e;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:42px;
    color:#00ff66;
}

.logo p{
    color:#aaaaaa;
    margin-top:10px;
}

.form-group{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2a2a2a;
    color:white;
    font-size:16px;
}

input:focus{
    outline:none;
    border:2px solid #00ff66;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    margin-top:12px;
}

#createBtn{
    background:#00cc66;
    color:#000;
}

#loginBtn{
    background:#0077ff;
    color:white;
}

button:hover{
    opacity:0.9;
}

#message{
    margin-top:15px;
    text-align:center;
    color:#ffcc00;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:14px;
}
</style></head><body><div class="container"><div class="logo">
    <h1>⚽ ArenaBet</h1>
    <p>Predict Football • Earn Points • Win Rewards</p>
</div>

<div class="form-group">
    <input
        type="text"
        id="username"
        placeholder="Enter Username">
</div>

<div class="form-group">
    <input
        type="email"
        id="email"
        placeholder="Enter Email">
</div>

<div class="form-group">
    <input
        type="password"
        id="password"
        placeholder="Enter Password">
</div>

<button id="createBtn" onclick="signup()">
    Create Account
</button>

<button id="loginBtn" onclick="login()">
    Login
</button>

<p id="message"></p>

<div class="footer">
    Welcome Bonus: 100 Points 🎁
</div>

</div><script type="module" src="script.js"></script></body>
</html>
