<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Voting Dashboard</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0d0d0d;
    color:white;
}

.header{
    background:#111;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #222;
}

.logo{
    font-size:24px;
    color:#ffcc00;
    font-weight:bold;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ffcc00;
    color:black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.dashboard{
    padding:20px;
}

.card-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:#1a1a1a;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px black;
}

.card h2{
    margin-top:0;
    color:#ffcc00;
}

.stat{
    font-size:35px;
    margin-top:10px;
}

.match{
    background:#1b1b1b;
    padding:20px;
    border-radius:15px;
    margin-top:25px;
}

.players{
    text-align:center;
    font-size:24px;
    margin-bottom:20px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.home{
    background:#d00000;
    color:white;
}

.draw{
    background:gray;
    color:white;
}

.away{
    background:#0077ff;
    color:white;
}

.result{
    margin-top:15px;
    text-align:center;
    font-size:18px;
}

</style>
</head>

<body>

<div class="header">

<div class="logo">
⚽ Football Arena
</div>

<div class="profile">
<div>
<h4>Abass</h4>
<p>Top Voter 🔥</p>
</div>

<div class="avatar">
A
</div>
</div>

</div>

<div class="dashboard">

<h1>Welcome Back 👋</h1>

<div class="card-container">

<div class="card">
<h2>Total Votes</h2>
<div class="stat" id="totalVotes">0</div>
</div>

<div class="card">
<h2>Matches Played</h2>
<div class="stat">5</div>
</div>

<div class="card">
<h2>Rank</h2>
<div class="stat">#1</div>
</div>

</div>

<!-- Match -->

<div class="match">

<div class="players">
🔥 Saka VS McGinn 🔥
</div>

<div class="buttons">

<button class="home" onclick="vote('m1')">
Home
</button>

<button class="draw" onclick="vote('m2')">
Draw
</button>

<button class="away" onclick="vote('m3')">
Away
</button>

</div>

<div class="result">
Home: <span id="m1">0</span> |
Draw: <span id="m2">0</span> |
Away: <span id="m3">0</span>
</div>

</div>

<div class="match">

<div class="players">
⚡ Osimhen VS Haaland ⚡
</div>

<div class="buttons">

<button class="home" onclick="vote('m4')">
Home
</button>

<button class="draw" onclick="vote('m5')">
Draw
</button>

<button class="away" onclick="vote('m6')">
Away
</button>

</div>

<div class="result">
Home: <span id="m4">0</span> |
Draw: <span id="m5">0</span> |
Away: <span id="m6">0</span>
</div>

</div>

</div>

<script>

let total = 0;

function vote(id){

let count = document.getElementById(id);

count.innerText = Number(count.innerText) + 1;

total++;

document.getElementById("totalVotes").innerText = total;

}

</script>

</body>
    </html>
