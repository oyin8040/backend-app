<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Voting Arena</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0d0d0d;
    color:white;
    padding-bottom:90px;
}

/* HEADER */

.header{
    background:#111;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #222;
}

.logo{
    font-size:24px;
    color:#ffcc00;
    font-weight:bold;
}

.wallet{
    background:#ffcc00;
    color:black;
    padding:8px 15px;
    border-radius:10px;
    font-weight:bold;
}

/* PROFILE */

.profile-section{
    padding:20px;
    display:flex;
    align-items:center;
    gap:15px;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#ffcc00;
    color:black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    font-weight:bold;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:#1b1b1b;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.card h3{
    margin:0;
    color:#ffcc00;
}

.card p{
    font-size:28px;
    margin-top:10px;
}

/* MATCHES */

.match{
    background:#1a1a1a;
    margin:20px;
    padding:20px;
    border-radius:15px;
}

.league{
    color:#ffcc00;
    margin-bottom:15px;
}

.teams{
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-align:center;
}

.team{
    width:35%;
}

.team img{
    width:70px;
}

.vs{
    font-size:22px;
    color:#ffcc00;
}

.buttons{
    margin-top:20px;
    display:flex;
    gap:10px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.home{
    background:#d00000;
    color:white;
}

.draw{
    background:gray;
    color:white;
}

.away{
    background:#0077ff;
    color:white;
}

.result{
    margin-top:15px;
    text-align:center;
}

/* LIVE */

.live{
    color:red;
    font-weight:bold;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

/* FOOTBALL */

.ball{
    text-align:center;
    font-size:60px;
    animation:spin 4s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

/* NAVIGATION */

.bottom-nav{
    position:fixed;
    bottom:0;
    width:100%;
    background:#111;
    display:flex;
    justify-content:space-around;
    padding:10px 0;
    border-top:2px solid #222;
}

.nav-item{
    text-align:center;
    color:white;
}

.nav-item p{
    margin:5px 0 0;
    font-size:12px;
}

.active{
    color:#ffcc00;
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="logo">
⚽ ArenaBet
</div>

<div class="wallet">
₦25,000
</div>

</div>

<!-- PROFILE -->

<div class="profile-section">

<div class="avatar">
A
</div>

<div>
<h2>Abass</h2>
<p>Top Predictor 🔥</p>
</div>

</div>

<!-- DASHBOARD -->

<div class="dashboard">

<div class="card">
<h3>Total Votes</h3>
<p id="totalVotes">0</p>
</div>

<div class="card">
<h3>Wins</h3>
<p>12</p>
</div>

<div class="card">
<h3>Rank</h3>
<p>#1</p>
</div>

</div>

<div class="ball">⚽</div>

<!-- MATCH 1 -->

<div class="match">

<div class="league">
🏆 Champions League <span class="live">LIVE</span>
</div>

<div class="teams">

<div class="team">
<img src="https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg">
<h3>Arsenal</h3>
</div>

<div class="vs">
VS
</div>

<div class="team">
<img src="https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg">
<h3>PSG</h3>
</div>

</div>

<div class="buttons">

<button class="home" onclick="vote('a1')">
Home
</button>

<button class="draw" onclick="vote('a2')">
Draw
</button>

<button class="away" onclick="vote('a3')">
Away
</button>

</div>

<div class="result">
Home: <span id="a1">0</span> |
Draw: <span id="a2">0</span> |
Away: <span id="a3">0</span>
</div>

</div>

<!-- MATCH 2 -->

<div class="match">

<div class="league">
⚽ Premier League
</div>

<div class="teams">

<div class="team">
<img src="https://upload.wikimedia.org/wikipedia/en/f/fd/Manchester_City_FC_badge.svg">
<h3>Haaland</h3>
</div>

<div class="vs">
VS
</div>

<div class="team">
<img src="https://upload.wikimedia.org/wikipedia/commons/0/01/Nigeria_Football_Federation_logo.svg">
<h3>Osimhen</h3>
</div>

</div>

<div class="buttons">

<button class="home" onclick="vote('b1')">
Home
</button>

<button class="draw" onclick="vote('b2')">
Draw
</button>

<button class="away" onclick="vote('b3')">
Away
</button>

</div>

<div class="result">
Home: <span id="b1">0</span> |
Draw: <span id="b2">0</span> |
Away: <span id="b3">0</span>
</div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

<div class="nav-item active">
🏠
<p>Home</p>
</div>

<div class="nav-item">
⚽
<p>Matches</p>
</div>

<div class="nav-item">
🎟️
<p>Bets</p>
</div>

<div class="nav-item">
👤
<p>Profile</p>
</div>

</div>

<script>

let total = 0;

function vote(id){

let count = document.getElementById(id);

count.innerText = Number(count.innerText) + 1;

total++;

document.getElementById("totalVotes").innerText = total;

}

</script>

</body>
    </html>
