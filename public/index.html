<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<style>

body{
    background:#121212;
    color:white;
    font-family:Arial;
    padding:20px;
}

.card{
    background:#1b1b1b;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

button{
    padding:15px;
    width:100%;
    border:none;
    border-radius:10px;
    background:#00ff66;
    color:black;
    font-size:18px;
}

</style>

</head>

<body>

<h1>⚽ ArenaBet Dashboard</h1>

<div class="card">

<h2>Welcome Back 🔥</h2>

<p id="userEmail"></p>

<p>Wallet: ₦25,000</p>

<p>Status: VIP Predictor ⭐</p>

</div>

<button onclick="logout()">
Logout
</button>

<script>

const email = localStorage.getItem("userEmail");

document.getElementById("userEmail").innerText = email;

/* LOGOUT */

function logout(){

    localStorage.clear();

    window.location.href = "index.html";

}

</script>

</body>
</html>
